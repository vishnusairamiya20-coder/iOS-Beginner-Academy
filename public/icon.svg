<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <g filter="url(#shadow)" transform="translate(136, 96)">
    <!-- Smartphone Frame -->
    <rect x="0" y="0" width="240" height="320" rx="36" fill="#18181b" stroke="#ffffff" stroke-width="8"/>
    <!-- Dynamic Island -->
    <rect x="85" y="16" width="70" height="18" rx="9" fill="#000000" />
    <!-- Screen area with subtle wallpaper gradient -->
    <rect x="14" y="44" width="212" height="236" rx="20" fill="#3b82f6" opacity="0.85"/>
    <!-- Home Bar Indicator -->
    <rect x="75" y="295" width="90" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <!-- Center Sparkle / Apple-like Guide icon -->
    <circle cx="120" cy="160" r="38" fill="#ffffff" />
    <path d="M120 135 L124 152 L141 156 L124 160 L120 177 L116 160 L99 156 L116 152 Z" fill="#2563eb"/>
  </g>
</svg>
